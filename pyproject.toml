[project]
name = "opencode-py"
version = "0.0.1"
description = "Python port of the OpenCode agent core (R0-A: provider/CI spike only)"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "httpx2>=2.12.0,<3",
    "pydantic>=2",
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
# P2-S3 (M5-A, OP-P2-4): the optional local HTTP server face. Deferred imports
# live only under src/opencode/httpapi/ -- core starts and works without this
# extra; importing the server face without it reports UnsupportedCapability.
server = [
    "fastapi>=0.162.2,<1",
    "uvicorn>=0.54.0,<1",
]

[project.scripts]
opencode = "opencode.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "maas_real: real MAAS endpoint short-session evidence (opt-in: OPENCODE_PY_MAAS_REAL=1 plus resolvable gateway config; skipped otherwise)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
