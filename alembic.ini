# Alembic configuration (R1-S2).
#
# The database URL is resolved per run via `-x db_path=<database file>` (used
# by tests/integration and CI). There is NO `sqlalchemy.url` key here on
# purpose (R1-S2 review N-1): a bare run without `-x db_path` fails fast in
# migrations/env.py instead of silently creating ./opencode.db in the CWD. The
# explicit app data-directory path arrives with the composition entrypoint
# (R1-S7).

[alembic]
script_location = %(here)s/src/opencode/storage/migrations
file_template = %%(rev)s_%%(slug)s
