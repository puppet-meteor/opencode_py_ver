# Alembic configuration (R1-S2).
#
# The database URL is resolved per run: prefer `-x db_path=<database file>`
# (used by tests/integration and CI); the `sqlalchemy.url` default below is a
# cwd-relative placeholder for local runs and is replaced by the explicit app
# data-directory path once the composition entrypoint lands (R1-S7).

[alembic]
script_location = %(here)s/src/opencode/storage/migrations
sqlalchemy.url = sqlite:///./opencode.db
file_template = %%(rev)s_%%(slug)s
