name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Single job matrix (pytest + lint + types together): keeps the private-repo
    # Windows runner minute cost (2x) bounded. No secrets, no real MAAS access.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Lock check
        run: uv lock --check
      - name: Sync locked environment
        # OP-P2-4 CI face (post-W1 fixup, dispatcher-owned like pyproject/uv.lock):
        # --all-extras matches the local gate shape (uv sync --all-extras
        # --all-groups) so optional-face tests (httpapi, watcher, later pty on
        # win32) actually run in CI. The old --extra server stopped at the
        # server face and the #192 watcher extras declaration never reached
        # CI, so the 18 W1 watcher tests failed at collection (ModuleNotFoundError:
        # watchfiles) on both matrix jobs.
        run: uv sync --locked --all-extras
      - name: Test suite (R0 contracts + R1 integration, full)
        run: uv run pytest -q
      - name: Platform probe (R0-B)
        # Sanitized evidence only: the probe records <WORKSPACE>/<TEMP>
        # placeholders, no host paths, usernames, PIDs, secrets or endpoints.
        # GITHUB_ACTIONS=true makes the probe self-mark results as ci_verified.
        run: uv run python tools/r0/platform_probe.py --output ${{ runner.temp }}/platform.json
      - name: Upload platform probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/platform.json
          if-no-files-found: error
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        # S-1 disposition (T-C1-077): tools/r5 joins the checked shape
        # (generate_schema_artifacts.py gained the pipelines module import);
        # three-source consistency = ci.yml + the T-C1-077 progress file + the
        # gate command form. Existing pytest/ruff routes untouched.
        run: uv run mypy src tools/r0 tools/pty0 tools/r5 tests/r0 tests/contract tests/integration
